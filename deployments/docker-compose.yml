# Sobe a mesma imagem que vai para o Cloud Run: o que se testa aqui é o que se
# publica lá.
services:
  api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    image: clima-cep:dev
    environment:
      # Falha rápido em vez de subir um servidor que devolve 500 em todo request.
      WEATHER_API: ${WEATHER_API:?defina WEATHER_API em deployments/.env}
      PORT: "8080"
    # PORTA troca só a porta do host, para o caso de 8080 já estar ocupada.
    ports:
      - "${PORTA:-8080}:8080"
    restart: unless-stopped
